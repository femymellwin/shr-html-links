heus/Grafana, ELK, Datadog,\nOpenTelemetry, or similar) and running incident response / on-call. - A security-conscious approach secrets, IAM, encryption, and least-privilege as defaults. - Startup temperament: ownership, pragmatism, and a bias to automate and ship. - Based in or willing to relocate to Bangalore, and up for an onsite/hybrid, in-person team.\nBonus Points\n- Experience running **ML/AI or GPU workloads** in production (inference serving, batch\npipelines, model deployment). - Experience with data-intensive infrastructure \u2014 streaming/queues (Kafka, SQS), data\npipelines, or large object/audio storage. - Exposure to **edge devices / IoT fleets**, OTA updates, or high-volume device-to-cloud\ningestion. - Experience with compliance/security frameworks (SOC 2, ISO 27001, DPDP). - FinOps / cloud cost-optimization experience. - Early-stage startup experience. ---\nWhy Join\n- Own infrastructure that's already live with leading retail brands and growing fast \u2014 real\nscale, real impact. - Work across genuinely interesting workloads: speech AI, GPU inference, large-scale data,\nand edge-to-cloud ingestion. - Small team, high ownership, direct line to engineering leadership \u2014 your decisions ship. - Build the platform foundation of a category-defining product from an early, influential seat.","summary":"6+ years in DevOps/SRE with hands-on AWS/GCP and Terraform experience; expertise in containers and Kubernetes; skilled in CI/CD pipelines and observability tools","responsibilities":"Build and maintain CI/CD pipelines; manage cloud infrastructure as code; run container orchestration; ensure reliability and incident response; support AI/ML workloads and data pipelines; enforce security and compliance","education":["Any Graduate"],"employmentType":"Full Time, Permanent","experienceMin":5,"experienceMax":8,"experienceText":"5-8 Yrs","jobType":"fulltime","locations":["Bengaluru"],"role":"Other","roleCategory":"Other","salaryLabel":"18-25 Lacs","salaryDi <script>
(function(){

const $=id=>document.getElementById(id);const state={query:'',companies:new Set(),locations:new Set(),role:'',department:'',minExp:'',maxExp:'',skills:'',skillsMode:'any',employment:'',industry:'',postedFrom:'',salaryOnly:false,savedOnly:false,sort:'newest',page:1,pageSize:20};

function initMulti(rootId,items,set,label){const root=$(rootId),btn=root.querySelector('.multi-btn'),menu=root.querySelector('.multi-menu'),search=root.querySelector('.multi-search'),options=root.querySelector('.multi-options'),clear=root.querySelector('.multi-clear');function draw(filter=''){options.innerHTML='';const needle=filter.trim().toLowerCase();items.filter(x=>!needle||x.value.toLowerCase().includes(needle)).forEach(item=>{const lab=document.createElement('label');lab.className='multi-option';const cb=document.createElement('input');cb.type='checkbox';cb.checked=set.has(item.value);cb.value=item.value;cb.addEventListener('change',()=>{cb.checked?set.add(item.value):set.delete(item.value);state.page=1;updateMultiLabel();applyFilters();});const text=document.createElement('span');text.textContent=item.value;const count=document.createElement('span');count.className='count';count.textContent=item.count;lab.append(cb,text,count);options.appendChild(lab);});}function updateMultiLabel(){btn.textContent=set.size?set.size+' '+label+(set.size===1?'':'s')+' selected':'All '+label+'s';}btn.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.multi.open').forEach(x=>{if(x!==root)x.classList.remove('open')});root.classList.toggle('open');if(root.classList.contains('open'))search.focus();});menu.addEventListener('click',e=>e.stopPropagation());search.addEventListener('input',()=>draw(search.value));clear.addEventListener('click',()=>{set.clear();draw(search.value);updateMultiLabel();state.page=1;applyFilters();});root._refresh=()=>{draw(search.value);updateMultiLabel();};draw();updateMultiLabel();}
function setHandlers(){
$('searchInput').addEventListener('input',e=>{state.query=e.target.value;state.page=1;applyFilters();});
[['roleFilter','role'],['deptFilter','department'],['minExp','minExp'],['maxExp','maxExp'],['employmentFilter','employment'],['industryFilter','industry'],['postedFrom','postedFrom'],['sortSelect','sort']].forEach(([id,key])=>$(id).addEventListener('change',e=>{state[key]=e.target.value;state.page=1;applyFilters();}));

$('skillsAny').addEventListener('click',()=>setSkillMode('any'));$('skillsAll').addEventListener('click',()=>setSkillMode('all'));

$('prevPage').addEventListener('click',()=>{if(state.page>1){state.page--;render();window.scrollTo({top:0,behavior:'smooth'});}});$('nextPage').addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(filtered.length/state.pageSize));if(state.page<pages){state.page++;render();window.scrollTo({top:0,behavior:'smooth'});}});

}

function matches(job){
const terms=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);if(terms.length&&!terms.every(t=>job.searchText.includes(t)))return false;
if(state.companies.size&&!state.companies.has(job.company))return false;if(state.locations.size&&!job.locations.some(x=>state.locations.has(x)))return false;if(state.role&&job.roleCategory!==state.role)return false;if(state.department&&job.department!==state.department)return false;if(state.employment&&job.employmentType!==state.employment)return false;if(state.industry&&job.industry!==state.industry)return false;

const skills=state.skills.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(skills.length){const hay=job.skills.join(' ').toLowerCase();if(state.skillsMode==='all'?!skills.every(x=>hay.includes(x)):!skills.some(x=>hay.includes(x)))return false;}
if(state.postedFrom&&dateOnly(job.createdDate.iso)<state.postedFrom)return false;if(state.salaryOnly&&!job.salaryDisclosed)return false;if(state.savedOnly&&!saved.has(job.id))return false;return true;}

function render(){renderStats();renderActiveFilters();renderJobs();updateSavedCounts();}
function renderStats(){const comps=new Set(filtered.map(x=>x.company));const locs=new Set(filtered.flatMap(x=>x.locations));$('statJobs').textContent=fmtNum(filtered.length);$('statCompanies').textContent=fmtNum(comps.size);$('statLocations').textContent=fmtNum(locs.size);$('statSaved').textContent=fmtNum(saved.size);$('resultHeading').textContent=filtered.length===1?'1 matching job':fmtNum(filtered.length)+' matching jobs';$('resultSubheading').textContent='From '+meta.jobCount+' records across '+meta.companyCount+' companies';}
function renderActiveFilters(){const out=$('activeFilters');out.innerHTML='';const chips=[];if(state.query)chips.push(['Search: '+state.query,()=>{$('searchInput').value='';state.query='';}]);if(state.companies.size)chips.push(['Company: '+[...state.companies].slice(0,2).join(', ')+(state.companies.size>2?' +'+(state.companies.size-2):''),()=>{state.companies.clear();$('companyMulti')._refresh();}]);if(state.locations.size)chips.push(['Location: '+[...state.locations].slice(0,2).join(', ')+(state.locations.size>2?' +'+(state.locations.size-2):''),()=>{state.locations.clear();$('locationMulti')._refresh();}]);if(state.role)chips.push(['Role: '+state.role,()=>{$('roleFilter').value='';state.role='';}]);if(state.department)chips.push(['Department: '+state.department,()=>{$('deptFilter').value='';state.department='';}]);if(state.minExp!==''||state.maxExp!=='')chips.push(['Experience: '+(state.minExp||'any')+'-'+(state.maxExp||'any')+' yrs',()=>{$('minExp').value='';$('maxExp').value='';state.minExp='';state.maxExp='';}]);if(state.skills)chips.push(['Skills: '+state.skills,()=>{$('skillInput').value='';state.skills='';}]);if(state.employment)chips.push(['Employment: '+state.employment,()=>{$('employmentFilter').value='';state.employment='';}]);if(state.industry)chips.push(['Industry: '+state.industry,()=>{$('industryFilter').value='';state.industry='';}]);if(state.postedFrom)chips.push(['Posted from: '+state.postedFrom,()=>{$('postedFrom').value='';state.postedFrom='';}]);if(state.salaryOnly)chips.push(['Salary disclosed',()=>{$('salaryOnly').checked=false;state.salaryOnly=false;}]);if(state.savedOnly)chips.push(['Saved only',()=>{$('savedOnly').checked=false;state.savedOnly=false;}]);chips.forEach(([label,fn])=>{const c=document.createElement('span');c.className='filter-chip';c.append(document.createTextNode(label));const b=document.createElement('button');b.type='button';b.innerHTML='&times;';b.addEventListener('click',()=>{fn();state.page=1;applyFilters();});c.appendChild(b);out.appendChild(c);});}
function renderJobs(){const out=$('jobs');out.innerHTML='';const start=(state.page-1)*state.pageSize,end=Math.min(start+state.pageSize,filtered.length),page=filtered.slice(start,end);if(!page.length){out.innerHTML='<div class="empty"><h3>No jobs match these filters</h3><p>Try removing a filter or using broader search terms.</p></div>';}else page.forEach(job=>out.appendChild(jobCard(job)));const pages=Math.max(1,Math.ceil(filtered.length/state.pageSize));$('paginationInfo').textContent=filtered.length?'Showing '+(start+1)+'-'+end+' of '+filtered.length+' - Page '+state.page+' of '+pages:'No results';$('prevPage').disabled=state.page<=1;$('nextPage').disabled=state.page>=pages;}
function jobCard(job){const card=document.createElement('article');card.className='job-card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','View details for '+job.title+' at '+job.company);const topSkills=job.skills.slice(0,8);card.innerHTML='<div class="job-top"><div><h3 class="job-title">'+esc(job.title)+'</h3><div class="job-company">'+esc(job.company)+'</div></div><button class="save-btn '+(saved.has(job.id)?'saved':'')+'" title="'+(saved.has(job.id)?'Remove from saved':'Save job')+'" aria-label="Save job">'+(saved.has(job.id)?'&#9733;':'&#9734;')+'</button></div><div class="meta-row"><span class="meta-item">&#128205; '+esc(listText(job.locations))+'</span><span class="meta-item">&#128188; '+esc(job.experienceText)+'</span><span class="meta-item">&#8377; '+esc(job.salaryLabel)+'</span><span class="meta-item">&#128065; '+fmtNum(job.viewCount)+'</span></div>'+(job.summary?'<p class="summary">'+esc(job.summary)+'</p>':'')+'<div class="skills">'+topSkills.map(x=>'<span class="skill">'+esc(x)+'</span>').join('')+(job.skills.length>8?'<span class="skill">+'+(job.skills.length-8)+' more</span>':'')+'</div><div class="card-footer"><span class="posted">Posted '+esc(job.createdDate.display||'date unavailable')+'</span><div class="card-actions">'+(job.url?'<a class="mini-btn" href="'+esc(job.url)+'" target="_blank" rel="noopener">Open source</a>':'')+'<button class="mini-btn view-btn">View details &#8594;</button></div></div>';
const saveBtn=card.querySelector('.save-btn');saveBtn.addEventListener('click',e=>{e.stopPropagation();toggleSaved(job.id);});card.querySelector('.view-btn').addEventListener('click',e=>{e.stopPropagation();openDrawer(job.id,card);});card.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));card.addEventListener('click',()=>openDrawer(job.id,card));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(job.id,card);}});return card;}
function toggleSaved(id){saved.has(id)?saved.delete(id):saved.add(id);persistSaved();if(state.savedOnly)applyFilters();else renderJobs();showToast(saved.has(id)?'Job saved':'Removed from saved');}
function updateSavedCounts(){$('savedCount').textContent=saved.size;$('statSaved').textContent=fmtNum(saved.size);$('savedTopBtn').classList.toggle('primary',state.savedOnly);}
function linkHtml(url,label){return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+'</a>':'';}
function openDrawer(id,focusEl){const job=jobs.find(x=>x.id===id);if(!job)return;lastFocus=focusEl||document.activeElement;$('drawerTitle').textContent=job.title;$('drawerCompany').textContent=job.company;const links=[linkHtml(job.companyOverviewUrl,'Company overview'),linkHtml(job.companyJobsUrl,'More company jobs'),linkHtml(job.companyWebsiteUrl,'Company website')].filter(Boolean).join('');$('drawerBody').innerHTML='<div class="detail-actions">'+(job.url?'<a class="btn primary" href="'+esc(job.url)+'" target="_blank" rel="noopener">Open job on Naukri &#8599;</a>':'')+'<button class="btn" id="detailSave">'+(saved.has(job.id)?'&#9733; Saved':'&#9734; Save job')+'</button><button class="btn" id="copyLink">Copy job URL</button></div><div class="detail-meta"><div class="box"><div class="label">Location</div><div class="value">'+esc(listText(job.locations))+'</div></div><div class="box"><div class="label">Experience</div><div class="value">'+esc(job.experienceText)+'</div></div><div class="box"><div class="label">Salary</div><div class="value">'+esc(job.salaryLabel)+'</div></div><div class="box"><div class="label">Employment</div><div class="value">'+esc(job.employmentType||'Not specified')+'</div></div><div class="box"><div class="label">Posted</div><div class="value">'+esc(job.createdDate.display||'Not specified')+'</div></div><div class="box"><div class="label">Views</div><div class="value">'+fmtNum(job.viewCount)+'</div></div></div>'+(job.summary?'<div class="section"><h3>Job summary</h3><p>'+esc(job.summary)+'</p></div>':'')+(job.responsibilities?'<div class="section"><h3>What you will do</h3><p>'+esc(job.responsibilities)+'</p></div>':'')+'<div class="section"><h3>Skills</h3><div class="detail-skills">'+(job.skills.length?job.skills.map(x=>'<span class="detail-skill">'+esc(x)+'</span>').join(''):'<span class="pretext">Not specified</span>')+'</div></div><div class="section"><h3>Role information</h3><div class="pretext">Role: '+esc(job.role||'Not specified')+'\nRole category: '+esc(job.roleCategory||'Not specified')+'\nDepartment: '+esc(job.department||'Not specified')+'\nIndustry: '+esc(job.industry||'Not specified')+'\nVacancies: '+esc(job.vacancy||'Not specified')+'</div></div>'+(job.education.length?'<div class="section"><h3>Education</h3><p>'+esc(job.education.join(', '))+'</p></div>':'')+(job.description?'<div class="section"><h3>Full job description</h3><div class="pretext">'+esc(job.description)+'</div></div>':'')+'<div class="section"><h3>Company</h3><div class="company-box"><b>'+esc(job.company)+'</b>'+(job.companyAddress?'<p style="margin-top:7px">'+esc(job.companyAddress)+'</p>':'')+(job.companyDescription?'<div class="pretext" style="margin-top:10px">'+esc(job.companyDescription)+'</div>':'')+(links?'<div class="company-links">'+links+'</div>':'')+'</div></div><div class="kbd-tip">Tip: press Esc to close this panel. Job ID: '+esc(job.id)+'</div>';
$('drawerBackdrop').classList.add('open');$('drawerBackdrop').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('detailSave').addEventListener('click',()=>{toggleSaved(job.id);openDrawer(job.id,lastFocus);});$('copyLink').addEventListener('click',()=>copyText(job.url||location.href.split('#')[0]+'#job='+encodeURIComponent(job.id)));if(location.hash!=='#job='+encodeURIComponent(job.id))history.replaceState(null,'','#job='+encodeURIComponent(job.id));setTimeout(()=>$('drawerClose').focus(),0);}
function closeDrawer(){if(!$('drawerBackdrop').classList.contains('open'))return;$('drawerBackdrop').classList.remove('open');$('drawerBackdrop').setAttribute('aria-hidden','true');document.body.style.overflow='';if(location.hash.startsWith('#job='))history.replaceState(null,'',location.pathname+location.search);if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function openHashJob(){if(location.hash.startsWith('#job=')){const id=decodeURIComponent(location.hash.slice(5));if(jobs.some(x=>x.id===id))openDrawer(id,null);}}
function copyText(text){if(!text){showToast('No source URL available');return;}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');showToast('Copied to clipboard');}catch(e){showToast('Copy failed');}t.remove();}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1600);}
function exportCsv(){if(!filtered.length){showToast('No jobs to export');return;}const cols=[['Title','title'],['Company','company'],['Locations','locations'],['Experience','experienceText'],['Salary','salaryLabel'],['Role category','roleCategory'],['Department','department'],['Industry','industry'],['Employment type','employmentType'],['Posted','createdDate'],['Views','viewCount'],['Skills','skills'],['URL','url']];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[cols.map(x=>q(x[0])).join(',')];filtered.forEach(j=>{lines.push(cols.map(([label,key])=>{let v=j[key];if(key==='locations'||key==='skills')v=v.join('; ');if(key==='createdDate')v=v.display;return q(v);}).join(','));});const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='filtered_jobs.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('CSV exported');}
initSelects();initMulti('companyMulti',meta.companies,state.companies,'company');initMulti('locationMulti',meta.locations,state.locations,'location');setHandlers();applyFilters();openHashJob();
})();
</script>
</body></html>
